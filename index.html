<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מילה במילה | Mot à Mot</title>
<meta name="description" content="משחק מילים בעברית ובצרפתית מול יריבים ממוחשבים. Jeu de lettres en hébreu et en français.">
<meta name="theme-color" content="#12414a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="home"></main>

<main id="game" hidden>
  <header class="bar">
    <button id="back" class="icon" aria-label="חזרה">‹</button>
    <div id="you" class="side"><span id="you-name" class="name"></span><span id="you-score" class="score">0</span></div>
    <div class="mid"><span id="stage-no" class="stage-no"></span><span id="bag"></span></div>
    <div id="opp" class="side"><span id="opp-name" class="name"></span><span id="opp-score" class="score">0</span></div>
  </header>

  <div id="board" class="board" role="grid" aria-label="לוח"></div>
  <p id="msg" class="msg" aria-live="polite"></p>
  <div id="rack" class="rack"></div>

  <div class="actions">
    <button id="recall"></button>
    <button id="shuffle"></button>
    <button id="play" class="primary"></button>
  </div>
  <div class="actions minor">
    <button id="hint"></button>
    <button id="swap"></button>
    <button id="pass"></button>
    <button id="words"></button>
  </div>
  <div id="legend" class="legend"></div>
</main>

<dialog id="dialog"></dialog>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
